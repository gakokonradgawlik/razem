name: razem
services:
  app:
    image: razem:0.1.0
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3100'
      DATABASE_PATH: /data/razem.sqlite
      # Required behind the HTTPS proxy: exact PWA origin for the CSRF/Origin check.
      PUBLIC_ORIGIN: ${RAZEM_PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${RAZEM_TRUST_PROXY:-}
    ports:
      - '127.0.0.1:${RAZEM_PORT:-3100}:3100'
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  worker:
    image: razem:0.1.0
    init: true
    restart: unless-stopped
    command: [node, apps/worker/dist/index.js]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/razem.sqlite
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  data:
