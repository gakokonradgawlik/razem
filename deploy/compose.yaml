name: razem
services:
  app:
    image: ${RAZEM_IMAGE:-razem:0.1.0}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3100'
      DATABASE_PATH: /data/razem.sqlite
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # Required behind the HTTPS proxy: exact PWA origin for the CSRF/Origin check.
      PUBLIC_ORIGIN: ${RAZEM_PUBLIC_ORIGIN:-}
      TRUST_PROXY: ${RAZEM_TRUST_PROXY:-}
    ports:
      - '${RAZEM_BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-${RAZEM_PORT:-3000}}:3100'
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3100/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
  worker:
    image: ${RAZEM_IMAGE:-razem:0.1.0}
    init: true
    restart: unless-stopped
    command: [node, apps/worker/dist/index.js]
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/razem.sqlite
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
    volumes:
      - data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "const fs=require('node:fs');process.exit(Date.now()-fs.statSync('/tmp/worker-ready').mtimeMs<45000?0:1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }
volumes:
  data:
networks:
  default:
    ipam:
      config:
        # Empty keeps Docker's default allocation; explicit subnet is useful on busy hosts.
        - subnet: ${RAZEM_NETWORK_SUBNET:-}
